# vllm-rdna-dash: the dashboard as a container, reachable from your whole network.
#
#   curl -fsSL https://raw.githubusercontent.com/crispyging/vllm-rdna-dash/main/compose.yml -o compose.yml
#   docker compose up -d                 # or: podman compose up -d
#
# Every setting is optional: put it in a .env next to this file. See the README.
#
# Then open http://your-gpu-box:7860 (its name or IP) from any machine on your network.
#
# There is no login by default, and the dashboard starts containers through the
# Docker socket, so anyone on your network can do that. Set RDNA_DASH_TOKEN to
# require a login.

name: vllm-rdna-dash
services:
  dash:
    image: ghcr.io/crispyging/vllm-rdna-dash:latest
    container_name: vllm-rdna-dash
    restart: unless-stopped
    # Host networking: the dashboard listens on the box's port 7860 and reaches the model server on localhost.
    network_mode: host
    # Lets the dashboard read the GPUs and check they are usable.
    devices: [/dev/kfd, /dev/dri]
    # The container runs as root, so rootful Docker opens the GPUs with these defaults. If the
    # dashboard says it cannot open /dev/kfd, set VIDEO_GID/RENDER_GID in .env to the numbers it shows.
    # Numbers only: names would resolve inside the image, not on the host.
    group_add: ["${VIDEO_GID:-44}", "${RENDER_GID:-992}"]          # rootless Podman: [keep-groups]
    security_opt: [label=disable]        # SELinux hosts (Fedora, RHEL)
    environment:
      # Models, caches, the generated vLLM compose.yml, benchmarks and settings live here.
      # It must be the same path on the host and in the container.
      RDNA_DASH_ROOT: ${DATA:-/srv/vllm-rdna}
      XDG_CONFIG_HOME: ${DATA:-/srv/vllm-rdna}/dash/config
      XDG_STATE_HOME: ${DATA:-/srv/vllm-rdna}/dash/state
      RDNA_DASH_TOKEN: ${RDNA_DASH_TOKEN:-}  # empty = no login; set one to require it
      RDNA_DASH_ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}  # extra hostnames to answer on (IPs and local names always work)
      RDNA_DASH_LABEL: ${BOX_NAME:-}         # name shown in the dashboard (default: hostname)
      RDNA_DASH_ENGINE: ${ENGINE:-docker}    # docker | podman | podman-rootless
      HF_TOKEN: ${HF_TOKEN:-}                # only for gated models
      RDNA_DASH_MODEL_DIRS: ${MODELS_DIR:-}  # a folder of models outside DATA; also add it under volumes, same path both sides
      # Same numbers as group_add above; used for the vLLM container the dashboard starts.
      VIDEO_GID: ${VIDEO_GID:-44}
      RENDER_GID: ${RENDER_GID:-992}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock   # Podman: its socket path
      - ${DATA:-/srv/vllm-rdna}:${DATA:-/srv/vllm-rdna}
      - /etc/os-release:/host/etc/os-release:ro
    command: ["--host", "0.0.0.0", "--port", "${PORT:-7860}"]
